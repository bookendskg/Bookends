<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookends Hospitality — Coming Soon</title>
<meta name="description" content="Bookends Hospitality is coming soon. Something worth waiting for is on its way." />
<link rel="icon" href="assets/Bookends_Logo_RoyalBlue.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070a16;
    --bg-2: #0d1228;
    --ink: #eef1fb;
    --muted: #9aa3c4;
    --accent: #4f6ef2;
    --accent-soft: #7d95f7;
    --line: rgba(99, 122, 242, 0.28);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
    position: relative;
  }

  /* ---- drifting aurora background ---- */
  .aurora {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    filter: blur(70px);
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.55;
    mix-blend-mode: screen;
  }
  .blob.b1 {
    width: 50vw; height: 50vw;
    background: radial-gradient(circle at 30% 30%, #4f6ef2, transparent 70%);
    top: -10%; left: -5%;
    animation: drift1 18s ease-in-out infinite;
  }
  .blob.b2 {
    width: 42vw; height: 42vw;
    background: radial-gradient(circle at 50% 50%, #2b3da8, transparent 70%);
    bottom: -15%; right: -8%;
    animation: drift2 22s ease-in-out infinite;
  }
  .blob.b3 {
    width: 34vw; height: 34vw;
    background: radial-gradient(circle at 50% 50%, #6d86ff, transparent 70%);
    top: 35%; left: 55%;
    animation: drift3 26s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(8vw, 6vh) scale(1.15); }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0) scale(1.05); }
    50%     { transform: translate(-7vw, -5vh) scale(0.9); }
  }
  @keyframes drift3 {
    0%,100% { transform: translate(0,0) scale(0.95); }
    50%     { transform: translate(-6vw, 7vh) scale(1.2); }
  }

  /* subtle star grain */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 1;
    background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 640px;
    width: 100%;
  }

  /* staggered entrance for direct children */
  .wrap > * {
    opacity: 0;
    transform: translateY(18px);
    animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .wrap > .logo-wrap { animation-delay: 0.05s; }
  .wrap > .eyebrow   { animation-delay: 0.25s; }
  .wrap > h1         { animation-delay: 0.40s; }
  .wrap > .lede      { animation-delay: 0.55s; }
  .wrap > form       { animation-delay: 0.70s; }
  .wrap > .note      { animation-delay: 0.80s; }
  .wrap > .divider   { animation-delay: 0.90s; }
  .wrap > footer     { animation-delay: 1.0s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- logo + shimmer sweep ---- */
  .logo-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 2.4rem;
    animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards, float 6s ease-in-out 1.1s infinite;
  }
  .logo-wrap img {
    width: min(340px, 70vw);
    height: auto;
    display: block;
    filter: drop-shadow(0 8px 30px rgba(79, 110, 242, 0.45));
  }
  /* shimmer that sweeps across the logo */
  .logo-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.55) 50%, transparent 60%);
    background-size: 250% 100%;
    background-position: 200% 0;
    mix-blend-mode: overlay;
    -webkit-mask: url("assets/Bookends_Logo_RoyalBlue.png") center/contain no-repeat;
            mask: url("assets/Bookends_Logo_RoyalBlue.png") center/contain no-repeat;
    animation: shimmer 5.5s ease-in-out 1.6s infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    35%  { background-position: -120% 0; }
    100% { background-position: -120% 0; }
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin-bottom: 1.3rem;
    display: inline-flex;
    align-items: center;
    gap: 0.7em;
  }
  .eyebrow .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(79,110,242,0.6);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(79,110,242,0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(79,110,242,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,110,242,0); }
  }

  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: clamp(2.6rem, 7.5vw, 4.6rem);
    line-height: 1.05;
    letter-spacing: 0.01em;
    margin-bottom: 1.4rem;
  }
  h1 em {
    font-style: italic;
    background: linear-gradient(100deg, var(--accent), var(--accent-soft));
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .lede {
    font-weight: 300;
    font-size: clamp(1rem, 2.4vw, 1.12rem);
    line-height: 1.7;
    color: var(--muted);
    max-width: 470px;
    margin: 0 auto 2.4rem;
  }

  form {
    display: flex;
    gap: 0.6rem;
    max-width: 430px;
    margin: 0 auto;
  }
  input[type="email"] {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.9rem 1.25rem;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
  }
  input[type="email"]::placeholder { color: var(--muted); }
  input[type="email"]:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 4px rgba(79,110,242,0.15);
  }

  button {
    background: linear-gradient(100deg, var(--accent), var(--accent-soft));
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0.9rem 1.6rem;
    font-family: inherit;
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(79,110,242,0.4);
    filter: brightness(1.07);
  }
  button:active { transform: translateY(0); }

  .note {
    margin-top: 1.1rem;
    font-size: 0.8rem;
    color: var(--muted);
    min-height: 1.2em;
    transition: color 0.3s;
  }
  .note.ok { color: var(--accent-soft); }

  .divider {
    width: 64px;
    height: 1px;
    margin: 2.6rem auto 1.5rem;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 200% 100%;
    animation: sweep 4s linear 1.2s infinite;
  }
  @keyframes sweep {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  footer {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .wrap > * { opacity: 1; transform: none; }
  }

  @media (max-width: 480px) {
    form { flex-direction: column; }
    button { width: 100%; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="wrap">
    <div class="logo-wrap">
      <img src="assets/Bookends_Logo_RoyalBlue.png" alt="Bookends Hospitality" />
    </div>

    <p class="eyebrow"><span class="dot"></span> Coming Soon</p>

    <h1>A new chapter<br /><em>is being written.</em></h1>

    <p class="lede">
      We're crafting an experience worth the wait. Leave your email and you'll be
      the first to know when Bookends Hospitality opens its doors.
    </p>

    <form id="notify" novalidate>
      <input
        type="email"
        id="email"
        placeholder="you@email.com"
        autocomplete="email"
        aria-label="Email address"
        required
      />
      <button type="submit">Notify me</button>
    </form>
    <p class="note" id="note" role="status" aria-live="polite"></p>

    <div class="divider"></div>
    <footer>&copy; 2026 Bookends Hospitality</footer>
  </main>

  <script>
    const form = document.getElementById("notify");
    const email = document.getElementById("email");
    const note = document.getElementById("note");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const value = email.value.trim();
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);

      if (!valid) {
        note.className = "note";
        note.textContent = "Please enter a valid email address.";
        email.focus();
        return;
      }

      // No backend yet — store locally so nothing is lost before launch.
      try {
        const list = JSON.parse(localStorage.getItem("bookends_signups") || "[]");
        if (!list.includes(value)) list.push(value);
        localStorage.setItem("bookends_signups", JSON.stringify(list));
      } catch (_) {}

      note.className = "note ok";
      note.textContent = "Thank you — we'll be in touch soon.";
      form.reset();
    });
  </script>
</body>
</html>
