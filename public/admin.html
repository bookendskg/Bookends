<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Bookends Hospitality</title>
<link rel="icon" href="assets/Bookends_Logo_RoyalBlue.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/Bookends_Logo_RoyalBlue.png" alt="Bookends" />
        <span>Admin</span>
      </div>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="brands"><span class="ms">restaurant</span><span>Brands</span></button>
        <button class="tab" data-tab="services"><span class="ms">tune</span><span>Services</span></button>
        <button class="tab" data-tab="automations"><span class="ms">bolt</span><span>Automations</span></button>
        <button class="tab" data-tab="sites"><span class="ms">location_on</span><span>Sites</span></button>
        <div class="tabs-sep"></div>
        <button class="tab" data-tab="settings"><span class="ms">settings</span><span>Settings</span></button>
        <button class="tab" data-tab="signups"><span class="ms">mail</span><span>Signups</span></button>
      </nav>

      <div class="sidebar-foot">
        <a class="view-site" href="/" target="_blank" rel="noopener"><span class="ms">open_in_new</span> View live site</a>
        <div class="user">
          <div class="avatar" id="avatar">B</div>
          <div class="user-meta">
            <div class="user-email" id="who">—</div>
            <button class="link-btn" id="logoutBtn">Log out</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- CONTENT -->
    <main class="admin-content">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><span class="ms" style="font-size:26px">menu</span></button>

      <header class="content-top">
        <div>
          <h1 id="pageTitle">Brands</h1>
          <p class="content-sub" id="pageSub">Manage your restaurant brands.</p>
        </div>
        <button class="btn btn-primary" id="addCardBtn"><span class="ms">add</span> Add card</button>
      </header>

      <div class="stat-row" id="statRow"></div>

      <!-- CARD SECTIONS -->
      <section class="panel" id="cardsPanel">
        <div class="panel-head">
          <p class="hint">Drag rows to reorder. Changes show on the live site instantly.</p>
        </div>
        <div class="row-list" id="cardList"></div>
      </section>

      <!-- SETTINGS -->
      <section class="panel" id="settingsPanel" style="display:none">
        <div id="settingsForms"></div>
      </section>

      <!-- SIGNUPS -->
      <section class="panel" id="signupsPanel" style="display:none">
        <div class="panel-head">
          <p class="hint" id="signupCount"></p>
          <a class="btn btn-ghost btn-sm" id="csvBtn" href="/api/admin/signups?format=csv">Download CSV</a>
        </div>
        <div id="signupsTable"></div>
      </section>
    </main>
  </div>

  <!-- CARD MODAL -->
  <div class="modal-back" id="modalBack">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Add card</h3>
        <button class="x" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <form id="cardForm">
        <input type="hidden" id="f_id" />
        <input type="hidden" id="f_section" />
        <div class="form-grid">
          <div class="full">
            <label class="field" style="margin:0">
              <span class="field-label">Title *</span>
              <input class="input" id="f_title" required />
            </label>
          </div>

          <div class="full" data-fields="brands">
            <label class="field" style="margin:0">
              <span class="field-label">Tagline / subtitle</span>
              <input class="input" id="f_subtitle" />
            </label>
          </div>

          <div class="full" data-fields="brands,services,automations">
            <label class="field" style="margin:0">
              <span class="field-label">Description</span>
              <textarea class="input" id="f_description"></textarea>
            </label>
          </div>

          <div data-fields="brands,services,automations">
            <label class="field" style="margin:0">
              <span class="field-label">CTA label</span>
              <input class="input" id="f_cta_label" />
            </label>
          </div>
          <div data-fields="brands,services,automations">
            <label class="field" style="margin:0">
              <span class="field-label">CTA link</span>
              <input class="input" id="f_cta_url" placeholder="# or https://" />
            </label>
          </div>

          <div class="full" data-fields="sites">
            <label class="field" style="margin:0">
              <span class="field-label">Location</span>
              <input class="input" id="f_location" placeholder="Miami, FL" />
            </label>
          </div>

          <div class="full">
            <span class="field-label">Image</span>
            <div class="img-picker">
              <div class="preview" id="f_preview"></div>
              <select class="input" id="f_image_path" style="flex:1;min-width:160px">
                <option value="">— No image —</option>
              </select>
            </div>
            <p class="hint" style="margin-top:.4rem">Add image files to the repo <code>assets/</code> folder, then pick one here.</p>
          </div>

          <div class="full check-row" data-fields="brands">
            <input type="checkbox" id="f_coming_soon" />
            <label for="f_coming_soon">"Coming soon" style card</label>
          </div>
          <div class="full check-row">
            <input type="checkbox" id="f_published" checked />
            <label for="f_published">Published (visible on site)</label>
          </div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="modalCancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modalSave">Save card</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/admin.js"></script>
</body>
</html>
